name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc-release, cc: gcc, cxx: g++, type: Release, flags: "" }
          - { name: clang-release, cc: clang, cxx: clang++, type: Release, flags: "" }
          - { name: clang16-release, cc: clang-16, cxx: clang++-16, type: Release, flags: "" }
          - { name: gcc-asan-ubsan, cc: gcc, cxx: g++, type: Debug, flags: "-DE7_SANITIZE=ON" }
          - { name: gcc-switch-dispatch, cc: gcc, cxx: g++, type: Release, flags: "-DE7_NO_COMPUTED_GOTO=ON" }
          - { name: gcc-shared, cc: gcc, cxx: g++, type: Release, flags: "-DE7_BUILD_SHARED=ON" }
    name: linux-${{ matrix.name }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: sudo apt-get update && sudo apt-get install -y ninja-build ${{ matrix.cc == 'clang-16' && 'clang-16' || '' }}
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.type }} -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} ${{ matrix.flags }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux-32bit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: sudo apt-get update && sudo apt-get install -y ninja-build gcc-multilib g++-multilib
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DCMAKE_EXE_LINKER_FLAGS=-m32
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  jni:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DE7_BUILD_JNI=ON -DE7_BUILD_TESTS=OFF
      - run: cmake --build build --target e7vm_jni
      - run: |
          mkdir -p classes
          javac -d classes platform/java/org/e7vm/*.java platform/java/test/E7VMTest.java
          java -Djava.library.path=build -cp classes E7VMTest

  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install -g typescript@5.6
      - run: tests/tsc/check.sh
      - name: SwiftPM and CMake build the same sources
        run: python3 scripts/check-source-lists.py
      - name: All version declarations agree
        run: python3 scripts/check-versions.py

  macos:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: release, flags: "-DCMAKE_BUILD_TYPE=Release" }
          - { name: debug-asan, flags: "-DCMAKE_BUILD_TYPE=Debug -DE7_SANITIZE=ON" }
    name: macos (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cmake -S . -B build ${{ matrix.flags }}
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: platform/ios/build_xcframework.sh
      - uses: actions/upload-artifact@v4
        with: { name: e7vm.xcframework, path: build-ios/e7vm.xcframework }

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME platform/android/build_android.sh
      - uses: actions/upload-artifact@v4
        with: { name: android-jniLibs, path: build-android/jniLibs }

  csharp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    name: csharp (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DE7_BUILD_SHARED=ON -DE7_BUILD_TESTS=OFF -DE7_BUILD_TOOLS=OFF
      - run: cmake --build build --config Release --target e7vm
      - run: dotnet run --project platform/windows/test -c Release -- build

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: mymindstorm/setup-emsdk@v14
        with: { version: "4.0.10" }
      - run: emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-wasm -j 4
      - run: ls -l build-wasm/e7wasm.*
      - run: node tests/wasm/smoke.mjs build-wasm/e7wasm.js
      - uses: actions/upload-artifact@v4
        with: { name: e7-wasm, path: "build-wasm/e7wasm.*" }
      # Build the website (e7lang/e7lang.github.io) against this commit and drive the playground
      # in a headless browser, so changes here cannot silently break the online playground.
      - name: Website + playground end-to-end
        run: |
          git clone --depth 1 --branch docusaurus https://github.com/e7lang/e7lang.github.io.git site \
            || git clone --depth 1 https://github.com/e7lang/e7lang.github.io.git site
          cd site
          cp ../build-wasm/e7wasm.js ../build-wasm/e7wasm.wasm static/playground/
          npm ci --no-audit --no-fund
          node scripts/sync-docs.mjs ..
          node scripts/check-examples.mjs
          npm run build
          npx --yes playwright@1.63.0 install --with-deps chromium
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          (npx docusaurus serve --port 3210 --no-open &)
          npx --yes wait-on@8.0.3 -t 60000 http://localhost:3210
          node scripts/e2e.mjs http://localhost:3210

  windows:
    strategy:
      fail-fast: false
      matrix:
        toolset: [msvc, clangcl]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Configure
        shell: pwsh
        run: |
          $t = @()
          if ("${{ matrix.toolset }}" -eq "clangcl") { $t = @("-T", "ClangCL") }
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 @t
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
