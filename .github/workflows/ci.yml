name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc-release, cc: gcc, cxx: g++, type: Release, flags: "" }
          - { name: clang-release, cc: clang, cxx: clang++, type: Release, flags: "" }
          - { name: clang16-release, cc: clang-16, cxx: clang++-16, type: Release, flags: "" }
          - { name: gcc-asan-ubsan, cc: gcc, cxx: g++, type: Debug, flags: "-DE7_SANITIZE=ON" }
          - { name: gcc-switch-dispatch, cc: gcc, cxx: g++, type: Release, flags: "-DE7_NO_COMPUTED_GOTO=ON" }
          - { name: gcc-shared, cc: gcc, cxx: g++, type: Release, flags: "-DE7_BUILD_SHARED=ON" }
    name: linux-${{ matrix.name }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: sudo apt-get update && sudo apt-get install -y ninja-build ${{ matrix.cc == 'clang-16' && 'clang-16' || '' }}
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.type }} -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} ${{ matrix.flags }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Stability (docs/ROADMAP.md 0.2.5, P0; CONTRIBUTING.md, "Testing"). The equivalence runs
  # (equiv_slice, equiv_step), allocation-failure injection (alloc_fail_test), the soak test and the
  # threads test are ctest tests and run in every job above; switch dispatch is linux-gcc-switch-dispatch.

  # The whole suite with a collection at every safepoint and every allocation where one is allowed,
  # under ASan + UBSan: a missing GC root becomes a use-after-free at once.
  gc-stress:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure (E7_GC_STRESS + E7_SANITIZE)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DE7_GC_STRESS=ON -DE7_SANITIZE=ON
      - run: cmake --build build
      - name: Test
        run: ctest --test-dir build -j 4 --output-on-failure --timeout 3600

  # Several VMs on several threads under ThreadSanitizer (tests/threads_test.cpp), plus the tests that
  # use threads already (e7_debug_pause from another thread).
  tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      # TSan of LLVM 18 cannot map its shadow memory with the 32 random mmap bits of recent kernels
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure (E7_TSAN, clang)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DE7_TSAN=ON -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - run: cmake --build build
      - name: Test
        env: { TSAN_OPTIONS: "halt_on_error=1 second_deadlock_stack=1" }
        run: ctest --test-dir build --output-on-failure -R "threads_test|debug_test|capi_test|capi_reentry_test|soak_test"

  # Forward compatibility (docs/BYTECODE.md section 5): modules compiled by the current e7c with
  # --target 0.2 run on the e7 of earlier releases with the same output; modules that need a newer VM
  # are rejected with E7_ERR_VERSION. `base` (E7_COMPAT_BASE) is the previous release: bump it after
  # each release. Programs whose output changed only because a newer VM fixed library behaviour are listed
  # with the reason in tests/compat/forward-allow/<base>.txt.
  forward-compat:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { base: v0.2.6 }
          - { base: v0.2.5 }
          - { base: v0.2.1 }
          - { base: v0.2.0 }
    name: forward-compat (${{ matrix.base }})
    runs-on: ubuntu-24.04
    env:
      E7_COMPAT_BASE: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build the current e7 / e7c
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DE7_BUILD_TESTS=OFF
          cmake --build build --target e7 e7c
      - name: Build e7 ${{ env.E7_COMPAT_BASE }}
        run: |
          mkdir ../e7-base
          git archive "$E7_COMPAT_BASE" | tar -x -C ../e7-base
          cmake -S ../e7-base -B build-base -G Ninja -DCMAKE_BUILD_TYPE=Release -DE7_BUILD_TESTS=OFF
          cmake --build build-base --target e7
      - name: Run current modules on ${{ env.E7_COMPAT_BASE }}
        run: |
          python3 tests/compat/forward_compat.py --old-e7 build-base/e7 --e7 build/e7 --e7c build/e7c \
            --base "$E7_COMPAT_BASE" --summary "$GITHUB_STEP_SUMMARY" \
            $(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' -e 's/^[[:space:]]*/--allow /' "tests/compat/forward-allow/$E7_COMPAT_BASE.txt") \
            tests/cases/lang/*.ts tests/cases/lib/*.ts tests/cases/modules/main_*.ts examples/*.ts

  # Backward compatibility (DESIGN-0.3.md D3): modules compiled by the compiler of an earlier release
  # run on the current VM with identical output (tests/compat/backward_compat.py)
  backward-compat:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { base: v0.2.6 }
    name: backward-compat (${{ matrix.base }})
    runs-on: ubuntu-24.04
    env:
      E7_COMPAT_BASE: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build the current e7
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DE7_BUILD_TESTS=OFF
          cmake --build build --target e7
      - name: Build e7 / e7c ${{ env.E7_COMPAT_BASE }}
        run: |
          mkdir ../e7-base
          git archive "$E7_COMPAT_BASE" | tar -x -C ../e7-base
          cmake -S ../e7-base -B build-base -G Ninja -DCMAKE_BUILD_TYPE=Release -DE7_BUILD_TESTS=OFF
          cmake --build build-base --target e7 e7c
      - name: Run ${{ env.E7_COMPAT_BASE }} modules on the current VM
        run: |
          allow=""
          if [ -f "tests/compat/backward-allow/$E7_COMPAT_BASE.txt" ]; then
            allow=$(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' -e 's/^[[:space:]]*/--allow /' "tests/compat/backward-allow/$E7_COMPAT_BASE.txt")
          fi
          python3 tests/compat/backward_compat.py --old-e7 build-base/e7 --old-e7c build-base/e7c --e7 build/e7 \
            --base "$E7_COMPAT_BASE" --summary "$GITHUB_STEP_SUMMARY" $allow \
            tests/cases/lang/*.ts tests/cases/lib/*.ts tests/cases/modules/main_*.ts examples/*.ts

  # Coverage of the VM, stdlib, crypto, C API and compiler over the whole ctest suite (clang
  # source-based coverage, scripts/coverage.py): a job summary and the coverage artifact
  # (coverage.txt / coverage.md / coverage.lcov / html).
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18 llvm-18
      - name: Build with E7_COVERAGE, run ctest, report
        env: { CC: clang-18, CXX: clang++-18, LLVM_PROFDATA: llvm-profdata-18, LLVM_COV: llvm-cov-18 }
        run: python3 scripts/coverage.py --build build-cov --jobs 4 --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: |
            build-cov/coverage.txt
            build-cov/coverage.md
            build-cov/coverage.lcov
            build-cov/html
          if-no-files-found: ignore

  # Performance gate (scripts/bench.py, CONTRIBUTING.md): instruction ticks and peak heap of every
  # bench/*.ts must equal bench/baseline.json; machine instructions under cachegrind (Ir) may not grow
  # by more than 3%. The measured numbers are uploaded as the bench-baseline artifact (a ready-made
  # bench/baseline.json for intended changes). The GC pause benchmark is reported, not gated.
  perf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build valgrind
      - name: Configure (Release, default gcc, as the Ir baseline)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DE7_BUILD_TESTS=OFF -DE7_BUILD_BENCH=ON
      - name: Build
        run: cmake --build build
      - name: Ticks, peak heap and instruction counts vs bench/baseline.json
        run: |
          valgrind --version
          python3 scripts/bench.py --check --cachegrind --output build/bench-baseline.json | tee build/bench.txt
      - name: GC pause benchmark (report only)
        if: ${{ !cancelled() }}
        run: build/e7_gc_pause | tee build/gc_pause.txt
      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          { echo '### Benchmarks (scripts/bench.py)'; echo '```'; cat build/bench.txt 2>/dev/null; echo '```';
            echo '### GC pauses (bench/gc_pause.cpp)'; cat build/gc_pause.txt 2>/dev/null; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: bench-baseline, path: build/bench-baseline.json, if-no-files-found: ignore }

  linux-32bit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: sudo apt-get update && sudo apt-get install -y ninja-build gcc-multilib g++-multilib
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DCMAKE_EXE_LINKER_FLAGS=-m32
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  jni:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DE7_BUILD_JNI=ON -DE7_BUILD_TESTS=OFF
      - run: cmake --build build --target e7vm_jni
      - run: |
          mkdir -p classes
          javac -d classes platform/java/org/e7vm/*.java platform/java/test/*.java \
            platform/android/shared-test/org/e7vm/ModuleManagerScenarios.java \
            platform/android/shared-test/org/e7vm/AsyncScenarios.java
          java -Djava.library.path=build -cp classes E7VMTest
          java -Djava.library.path=build -cp classes ModuleManagerTest
          java -Djava.library.path=build -cp classes AsyncTest

  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install -g typescript@5.6
      - run: tests/tsc/check.sh
      - name: docs/TYPESCRIPT.md is up to date with tests/ts-features
        run: python3 scripts/gen-ts-features.py --check
      - name: SwiftPM and CMake build the same sources
        run: python3 scripts/check-source-lists.py
      - name: All version declarations agree
        run: python3 scripts/check-versions.py

  # macOS / iOS builds and tests run on a maintainer's Mac: scripts/macos.sh test (see CONTRIBUTING.md)

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME platform/android/build_android.sh
      - uses: actions/upload-artifact@v4
        with: { name: android-jniLibs, path: build-android/jniLibs }

  csharp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    name: csharp (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DE7_BUILD_SHARED=ON -DE7_BUILD_TESTS=OFF -DE7_BUILD_TOOLS=OFF
      - run: cmake --build build --config Release --target e7vm
      - run: dotnet run --project platform/windows/test -c Release -- build

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: mymindstorm/setup-emsdk@v14
        with: { version: "4.0.10" }
      - run: emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-wasm -j 4
      - run: ls -l build-wasm/e7wasm.*
      - run: node tests/wasm/smoke.mjs build-wasm/e7wasm.js
      - uses: actions/upload-artifact@v4
        with: { name: e7-wasm, path: "build-wasm/e7wasm.*" }
      # Build the website (e7lang/e7lang.github.io) against this commit and drive the playground
      # in a headless browser, so changes here cannot silently break the online playground.
      - name: Website + playground end-to-end
        run: |
          git clone --depth 1 https://github.com/e7lang/e7lang.github.io.git site
          cd site
          cp ../build-wasm/e7wasm.js ../build-wasm/e7wasm.wasm static/playground/
          npm ci --no-audit --no-fund
          node scripts/sync-docs.mjs ..
          node scripts/check-examples.mjs
          npm run build
          npx --yes playwright@1.63.0 install --with-deps chromium
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          (npx docusaurus serve --port 3210 --no-open &)
          npx --yes wait-on@8.0.3 -t 60000 http://localhost:3210
          node scripts/e2e.mjs http://localhost:3210

  windows:
    strategy:
      fail-fast: false
      matrix:
        toolset: [msvc, clangcl]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Configure
        shell: pwsh
        run: |
          $t = @()
          if ("${{ matrix.toolset }}" -eq "clangcl") { $t = @("-T", "ClangCL") }
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 @t
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
