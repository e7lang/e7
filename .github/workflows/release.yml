name: Release

# Builds prebuilt e7 / e7c binaries + static libraries for every desktop platform and
# attaches them to a GitHub Release. Start it either way:
#   - push a version tag:  git tag v1.0.0 && git push origin v1.0.0
#   - or on GitHub: Releases -> Draft a new release -> new tag v1.0.0 -> Publish
# Run it manually (workflow_dispatch) to build the archives without publishing.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Publish a release with this new tag (e.g. v1.0.0) at the selected commit; empty = build only"
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, os: ubuntu-22.04,
              cmake: '-G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"' }
          - { platform: linux-arm64, os: ubuntu-22.04-arm,
              cmake: '-G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"' }
          - { platform: macos-universal, os: macos-14,
              cmake: '-G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0' }
          - { platform: windows-x64, os: windows-2022,
              cmake: '-G "Visual Studio 17 2022" -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded' }
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    env:
      # Optional code signing; each step below is skipped when its secrets are not configured.
      # macOS: APPLE_CERT_P12 (base64 Developer ID Application .p12), APPLE_CERT_PASSWORD,
      #        APPLE_SIGNING_IDENTITY ("Developer ID Application: Name (TEAMID)"),
      #        APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (app-specific password, for notarization)
      # Windows: WINDOWS_CERT_PFX (base64 .pfx), WINDOWS_CERT_PASSWORD
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install Ninja
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ninja; else sudo apt-get update && sudo apt-get install -y ninja-build; fi
      - name: Version
        id: ver
        run: |
          if [ -n "${{ inputs.tag }}" ]; then t="${{ inputs.tag }}"; v="${t#v}";
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="$(sed -n 's/^project(e7vm VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)-dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Check tag matches CMake project version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        run: |
          want="$(sed -n 's/^project(e7vm VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          [ "${{ steps.ver.outputs.version }}" = "$want" ] || { echo "tag v${{ steps.ver.outputs.version }} != CMake version $want" >&2; exit 1; }
      - name: Configure
        run: cmake -S . -B build ${{ matrix.cmake }}
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS' && env.APPLE_CERT_P12 != ''
        env:
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/sign.keychain-db"; kcpw="$(uuidgen)"
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          for b in build/e7 build/e7c; do
            codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$b"
            codesign --verify --strict --verbose=2 "$b"
          done
          ditto -c -k --keepParent build/e7 "$RUNNER_TEMP/e7.zip"
          ditto -c -k --keepParent build/e7c "$RUNNER_TEMP/e7c.zip"
          for z in e7 e7c; do
            xcrun notarytool submit "$RUNNER_TEMP/$z.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --wait
          done
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Sign (Windows)
        if: runner.os == 'Windows' && env.WINDOWS_CERT_PFX != ''
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          echo "$WINDOWS_CERT_PFX" | base64 --decode > "$RUNNER_TEMP/cert.pfx"
          signtool="$(ls "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe | sort -V | tail -1)"
          for b in build/Release/e7.exe build/Release/e7c.exe; do
            "$signtool" sign //fd SHA256 //tr http://timestamp.digicert.com //td SHA256 \
              //f "$RUNNER_TEMP/cert.pfx" //p "$WINDOWS_CERT_PASSWORD" "$b"
            "$signtool" verify //pa //v "$b"
          done
          rm -f "$RUNNER_TEMP/cert.pfx"
      - name: Package
        id: pkg
        run: echo "archive=$(scripts/package.sh build ${{ steps.ver.outputs.version }} ${{ matrix.platform }})" >> "$GITHUB_OUTPUT"
      - name: Smoke test the packaged binaries
        run: |
          d="dist/e7-${{ steps.ver.outputs.version }}-${{ matrix.platform }}"
          exe=""; [ "$RUNNER_OS" = "Windows" ] && exe=".exe"
          "$d/bin/e7$exe" --version
          "$d/bin/e7c$exe" --version
          want=0fa1ee36e152de30350b6a463f4f365d6574bea59f99ccfebb599c7b6b1f1fd6
          got=$("$d/bin/e7$exe" examples/embed/sign.ts | tr -d '\r')
          [ "$got" = "$want" ] || { echo "source run: got '$got'" >&2; exit 1; }
          "$d/bin/e7c$exe" examples/embed/sign.ts -o smoke.e7b
          got=$("$d/bin/e7$exe" smoke.e7b | tr -d '\r')
          [ "$got" = "$want" ] || { echo "bytecode run: got '$got'" >&2; exit 1; }
          if [ "$RUNNER_OS" = "macOS" ]; then lipo -info "$d/bin/e7"; otool -L "$d/bin/e7"; fi
          if [ "$RUNNER_OS" = "Linux" ]; then ldd "$d/bin/e7" || true; fi
      - name: SHA-256
        run: |
          cd dist
          f=$(basename "${{ steps.pkg.outputs.archive }}")
          if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
          cat "$f.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: e7-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Homebrew formula and Scoop manifest
        run: python3 scripts/gen-packaging.py "${{ steps.tag.outputs.tag }}" dist dist
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ls -l dist
          cat > notes.md <<NOTES
          Prebuilt E7 toolchain (\`e7\` runner, \`e7c\` compiler) and static libraries for embedding.

          | Platform | Archive |
          |---|---|
          | Linux x64 (glibc 2.35+) | \`e7-${TAG#v}-linux-x64.tar.gz\` |
          | Linux arm64 (glibc 2.35+) | \`e7-${TAG#v}-linux-arm64.tar.gz\` |
          | macOS 11+ (Apple Silicon + Intel) | \`e7-${TAG#v}-macos-universal.tar.gz\` |
          | Windows x64 | \`e7-${TAG#v}-windows-x64.zip\` |

          Each archive contains \`bin/\`, \`include/e7/e7.h\`, \`lib/\`, \`bindings/\` (C#, Swift, Java/Kotlin), \`types/e7.d.ts\`, \`examples/\`.
          Try the language without installing anything: https://e7lang.github.io/playground
          Verify downloads with the matching \`.sha256\` file.
          NOTES
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            # creates the tag at the built commit when it does not exist yet (manual publish)
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "E7 $TAG" --notes-file notes.md -R "$GITHUB_REPOSITORY"
          fi
      - name: Update the Homebrew tap (e7lang/homebrew-tap)
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "::notice::HOMEBREW_TAP_TOKEN not set; formula attached to the release only"; exit 0; fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/e7lang/homebrew-tap.git" tap
          mkdir -p tap/Formula && cp dist/e7.rb tap/Formula/e7.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/e7.rb
          git diff --cached --quiet || { git commit -m "e7 ${{ steps.tag.outputs.tag }}"; git push; }

  # Install the published release the way users will, and run it.
  verify-homebrew:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: brew install from the release's formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv 2>/dev/null || /home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          gh release download "${{ needs.publish.outputs.tag }}" -p e7.rb -R "$GITHUB_REPOSITORY"
          brew tap-new --no-git e7lang/verify
          cp e7.rb "$(brew --repository e7lang/verify)/Formula/e7.rb"
          HOMEBREW_NO_AUTO_UPDATE=1 brew install e7lang/verify/e7
          brew test e7lang/verify/e7
          e7 --version
          printf 'export function main(): number { return 6 * 7; }\n' > t.ts && e7 t.ts

  verify-scoop:
    needs: publish
    runs-on: windows-2022
    steps:
      - name: scoop install from the release's manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ needs.publish.outputs.tag }}" -p e7.json -R "$env:GITHUB_REPOSITORY"
          iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          scoop install .\e7.json
          e7 --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          'export function main(): number { return 6 * 7; }' | Set-Content -Encoding utf8NoBOM t.ts
          $out = (e7 t.ts | Out-String).Trim()
          if ($out -ne '42') { throw "unexpected output: $out" }
