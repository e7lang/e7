name: swift

on:
  push:
    branches: [main, 'feat/swift']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  spm-macos:
    name: swift build + test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test

  spm-ios:
    name: swift package (iOS simulator)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build E7VM for iOS (generic simulator)
        run: xcodebuild -scheme E7VM -destination 'generic/platform=iOS Simulator' build
      - name: Test on an iOS simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          print(next(x["udid"] for rt, xs in sorted(d.items(), reverse=True) if "iOS" in rt for x in xs if x["name"].startswith("iPhone")))')
          echo "simulator $UDID"
          xcodebuild -scheme e7-Package -destination "id=$UDID" test

  xcframework:
    name: CMake XCFramework (build_xcframework.sh)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: platform/ios/build_xcframework.sh
      - run: test -d build-ios/e7vm.xcframework
